<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Покажи и скажи">
<title>Покажи и скажи</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="theme-color" content="#DCEEFF">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --bg:#E4F1FF; --ink:#1F2A44; --soft:#5B6B8C; --panel:#ffffff; --on:#1F2A44; --onInk:#ffffff;
  --cardInk:#1F2A44; --ledge:rgba(31,42,68,.16); --ok:#1E7A4C;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16203A; --ink:#F1F4FF; --soft:#A7B4D4; --panel:#232F4E; --on:#F1F4FF; --onInk:#16203A;
    --ledge:rgba(0,0,0,.4); --ok:#5BD69A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16203A; --ink:#F1F4FF; --soft:#A7B4D4; --panel:#232F4E; --on:#F1F4FF; --onInk:#16203A;
  --ledge:rgba(0,0,0,.4); --ok:#5BD69A; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Rubik",-apple-system,"Helvetica Neue",system-ui,sans-serif;font-weight:500;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:4px solid #3B82F6;outline-offset:3px}
#app{height:100%;max-width:1180px;margin:0 auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}

.home{overflow-y:auto;height:100%;display:flex;flex-direction:column;gap:22px;padding-bottom:12px}
.home h1{margin:8px 0 0;font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.cats{display:flex;flex-wrap:wrap;gap:12px}
.chip{border:0;border-radius:22px;background:var(--panel);padding:14px 20px 14px 16px;display:flex;align-items:center;gap:10px;font-size:20px;box-shadow:0 5px 0 var(--ledge)}
.chip .ci{font-size:34px;line-height:1}
.chip.on{background:var(--on);color:var(--onInk)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mode{border:0;border-radius:32px;padding:26px 24px;min-height:170px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:14px;font-size:clamp(22px,3vw,30px);font-weight:700;color:#1F2A44;box-shadow:0 9px 0 var(--ledge)}
.mode .mi{font-size:64px;line-height:1}
.mode:active{transform:translateY(5px);box-shadow:0 4px 0 var(--ledge)}
.m1{background:#FFD6A5}.m2{background:#BDB2FF}.m3{background:#CAFFBF}.m4{background:#FFC6FF}.m5{background:#9BF6FF}.m6{background:#FDFFB6}
.tiles{display:grid;justify-content:center;align-content:center}
.tile{position:relative;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.14);background:var(--c);transition:opacity .35s;box-shadow:0 calc(var(--s)*.04) 0 var(--ledge)}
.tile.dim{opacity:.16}
.tile.lit{box-shadow:0 0 0 calc(var(--s)*.045) var(--bg),0 0 0 calc(var(--s)*.09) var(--ink);animation:pulse 1.2s ease infinite}
.tbadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(var(--s)*.45);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.pbar{display:flex;justify-content:center;gap:14px;flex:0 0 auto;flex-wrap:wrap}
.pbtn{border:0;border-radius:18px;padding:14px 26px;font-size:20px;font-weight:700;background:var(--panel);box-shadow:0 5px 0 var(--ledge)}
.pbtn.ok{background:#30A46C;color:#fff}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lvl{border:0;border-radius:24px;background:var(--panel);padding:18px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--ledge)}
.lvl .li{font-size:40px;line-height:1.1}
.lvl b{font-size:20px}
.lvl small{color:var(--soft);font-size:15px;line-height:1.4}
.lvl.on{box-shadow:0 0 0 4px var(--ink),0 5px 0 var(--ledge)}
.play{align-self:flex-start;font-size:24px;padding:18px 34px}
.tbadge.part{font-size:calc(var(--s)*.5);text-shadow:none}
.pbtn:active{transform:translateY(3px)}
.obj .badge{position:absolute;top:5%;right:5%;width:calc(var(--s)*.3);height:calc(var(--s)*.3);min-width:30px;min-height:30px;border-radius:50%;background:#22A45D;color:#fff;font-weight:800;font-size:max(18px,calc(var(--s)*.18));display:flex;align-items:center;justify-content:center}
.obj.on .emo{opacity:.6}
.card.next{animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.answers{display:flex;justify-content:center;gap:16px;flex:0 0 auto;flex-wrap:wrap}
.answers[hidden]{display:none}
.ans{border:0;border-radius:24px;background:var(--panel);box-shadow:0 6px 0 var(--ledge);padding:12px 24px 14px;min-width:120px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ans b{font-size:60px;line-height:1;font-weight:800}
.ans:active{transform:translateY(4px)}
.dots{display:grid;gap:5px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:#F59E0B;display:block}
.hand{position:absolute;font-size:calc(var(--b)*.14);line-height:1;transform:translate(-30%,-4%);pointer-events:none;transition:opacity .25s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.beats{display:flex;justify-content:center;gap:14px;flex:0 0 auto;min-height:36px}
.beat{width:36px;height:36px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 3px var(--soft);opacity:.55}
.beat.demo{background:#F59E0B;box-shadow:none;opacity:1}
.beat.me{background:#22A45D;box-shadow:none;opacity:1}
.drum{border:0;border-radius:50%;width:min(58vmin,420px);height:min(58vmin,420px);background:#FFC6FF;color:#1F2A44;box-shadow:0 12px 0 var(--ledge);font-size:min(28vmin,200px);line-height:1;display:flex;align-items:center;justify-content:center;touch-action:none}
.drum.wait{opacity:.7}
.hit{animation:hit .22s ease}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
.card .ph{width:80%;height:68%;object-fit:cover;border-radius:calc(var(--s)*.12)}
.row .re{overflow:hidden}
.re img{width:100%;height:100%;object-fit:cover}
.famadd{display:flex;gap:16px;align-items:center;background:var(--panel);border-radius:22px;padding:14px;flex-wrap:wrap;flex:0 0 auto}
.famph{border:2px dashed var(--soft);background:var(--bg);border-radius:20px;width:124px;height:124px;font-size:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;padding:0}
.famph span{font-size:14px;color:var(--soft)}
.famph img{width:100%;height:100%;object-fit:cover}
.famf{flex:1;min-width:220px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.famf input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
.big-rec[disabled]{opacity:.4;cursor:default}
.board{position:relative;width:var(--b);height:var(--b);background:var(--panel);border-radius:32px;box-shadow:0 8px 0 var(--ledge);overflow:hidden}
.board svg,.board canvas{position:absolute;inset:0;width:100%;height:100%}
.board canvas{touch-action:none}
.reward{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.45);pointer-events:none;animation:yay .9s ease}
.grown{background:var(--panel);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.grown h2{margin:0;font-size:18px;color:var(--soft);font-weight:700}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.segl{min-width:220px;font-size:17px}
.segb{display:flex;flex-wrap:wrap;gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.segb button{border:0;background:transparent;border-radius:10px;padding:9px 16px;font-size:16px}
.segb button.on{background:var(--on);color:var(--onInk)}
.tip{margin:0;font-size:15px;line-height:1.5;color:var(--soft);max-width:70ch}
.warn{margin:0;font-size:15px;line-height:1.5;color:#B4471C}
.big-rec{align-self:flex-start;border:0;border-radius:16px;background:#FFADAD;color:#1F2A44;padding:14px 20px;font-size:18px;font-weight:700;box-shadow:0 4px 0 var(--ledge)}

.bar{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.bar .title{font-size:24px;font-weight:700;flex:1;display:flex;align-items:center;gap:10px}
.bar .title span{font-size:34px}
.back{position:relative;overflow:hidden;border:0;border-radius:16px;background:var(--panel);padding:12px 18px;font-size:17px;color:var(--soft);box-shadow:0 4px 0 var(--ledge)}
.back .fill{position:absolute;inset:0;background:var(--on);opacity:.18;transform:scaleX(0);transform-origin:left}
.back.holding .fill{transform:scaleX(1);transition:transform 1s linear}
.back .bl{position:relative}
.ctl{border:0;border-radius:18px;background:var(--panel);width:64px;height:64px;font-size:32px;box-shadow:0 4px 0 var(--ledge)}
.ctl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ledge)}
.stars{flex:1;display:flex;justify-content:center;gap:6px;font-size:36px}
.stars .dim{opacity:.22;filter:grayscale(1)}
.q{flex:0 0 auto;text-align:center;font-size:clamp(34px,6vw,60px);font-weight:800}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.grid{display:grid;gap:16px;justify-content:center}
.card{position:relative;width:var(--s);height:var(--s);border:0;border-radius:calc(var(--s)*.2);background:var(--c);color:var(--cardInk);box-shadow:0 calc(var(--s)*.04) 0 var(--ledge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%}
.card .emo{font-size:calc(var(--s)*.5);line-height:1}
.card .word{font-size:max(15px,calc(var(--s)*.1));font-weight:700}
.card:active{transform:translateY(4px)}

/* recording screen */
.recwrap{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.cats.small .chip{padding:10px 16px 10px 12px;font-size:17px}
.cats.small .chip .ci{font-size:26px}
.row{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:18px;padding:10px 14px}
.row .re{flex:0 0 auto;font-size:40px;width:64px;height:64px;border-radius:16px;background:var(--c);display:flex;align-items:center;justify-content:center}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .rt b{font-size:19px}
.row .rt small{color:var(--soft);font-size:14px;line-height:1.35}
.row .rt .has{color:var(--ok);font-size:14px}
.rb{flex:0 0 auto;border:0;border-radius:14px;background:var(--bg);padding:12px 14px;font-size:16px;min-width:52px}
.rb.rec{background:#FFADAD;color:#1F2A44}
.rb.recording{background:#E5484D;color:#fff}
.rb[disabled]{opacity:.35;cursor:default}

.pop{animation:pop .45s ease}.yay{animation:yay .8s ease}.nope{animation:nope .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes yay{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-3deg)}60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1)}}
@keyframes nope{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
@keyframes blink{50%{opacity:.55}}
.recording{animation:blink 1s ease infinite}
.spark{position:absolute;font-size:calc(var(--s)*.18);pointer-events:none;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(calc(var(--s)*-.6)) scale(1.2)}}
.party{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:5;font-size:clamp(48px,9vw,96px);font-weight:800;gap:10px;animation:fadein .3s ease}
.party .big{font-size:clamp(110px,22vw,220px);line-height:1;animation:yay 1s ease infinite}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .pop,.yay,.nope,.party .big,.recording,.hit,.card.next,.tile.lit{animation:none}
  .spark{display:none}
  .back.holding .fill{transition:none}
}

/* ================= visual refresh ================= */
:root{--sky1:#FFFFFF;--sky2:#DCEEFF;--hill1:#C9EFD2;--hill2:#B3E6C0;--cloud:rgba(255,255,255,.85);--shine:rgba(255,255,255,.55);--glass:rgba(255,255,255,.78)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#2B3B68;--sky2:#1B2748;--hill1:#1E3A37;--hill2:#183230;--cloud:rgba(255,255,255,.06);--shine:rgba(255,255,255,.12);--glass:rgba(35,47,78,.85)}}
:root[data-theme="dark"]{--sky1:#2B3B68;--sky2:#1B2748;--hill1:#1E3A37;--hill2:#183230;--cloud:rgba(255,255,255,.06);--shine:rgba(255,255,255,.12);--glass:rgba(35,47,78,.85)}
body{font-family:"Nunito","Rubik",-apple-system,"Helvetica Neue",system-ui,sans-serif;font-weight:700;
  background:radial-gradient(130% 90% at 50% -15%,var(--sky1) 0%,var(--sky2) 55%,var(--bg) 100%) fixed}
body::before{content:"";position:fixed;left:-15%;right:-15%;bottom:-38vmin;height:62vmin;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 55% at 28% 45%,var(--hill1) 0 62%,transparent 63%),radial-gradient(60% 60% at 78% 55%,var(--hill2) 0 62%,transparent 63%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(9vmin 4vmin at 14% 14%,var(--cloud) 0 98%,transparent 100%),radial-gradient(7vmin 3.4vmin at 19% 12%,var(--cloud) 0 98%,transparent 100%),
             radial-gradient(11vmin 4.6vmin at 82% 9%,var(--cloud) 0 98%,transparent 100%),radial-gradient(7vmin 3.6vmin at 77% 7%,var(--cloud) 0 98%,transparent 100%)}

/* hero */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:6px}
.hero-emo{font-size:clamp(40px,6vw,58px);display:flex;gap:10px;line-height:1}
.hero-emo span{display:inline-block;animation:hop 2.6s ease-in-out infinite}
.hero-emo span:nth-child(2){animation-delay:.25s}.hero-emo span:nth-child(3){animation-delay:.5s}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}90%{transform:translateY(0)}}
.home h1{font-weight:900;font-size:clamp(38px,6.5vw,62px);margin:0;letter-spacing:-.015em}

/* mode cards */
.modes{gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mode>span{position:relative;z-index:1}
.mode{border-radius:36px;min-height:180px;padding:22px;font-weight:800;position:relative;overflow:hidden;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.06),0 9px 0 var(--ledge),0 18px 30px rgba(31,42,68,.12)}
.mode .mi{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.mode::after{content:"";position:absolute;right:-30px;bottom:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.25)}
.m1{background:linear-gradient(160deg,#FFE6C7,#FFC98F)}.m2{background:linear-gradient(160deg,#DCD5FF,#B2A5FF)}
.m3{background:linear-gradient(160deg,#DDFFD6,#B2F0A6)}.m4{background:linear-gradient(160deg,#FFDDFF,#FFB5FB)}
.m5{background:linear-gradient(160deg,#C9FBFF,#86EAF7)}.m6{background:linear-gradient(160deg,#FFF9C7,#FFE98A)}

/* chips, buttons, panels */
.chip{background:var(--glass);font-weight:800;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip.on{background:var(--on)}
.grown{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:28px}
.adult{background:transparent}
.adult>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--glass);border-radius:999px;padding:12px 20px;font-size:17px;color:var(--soft);box-shadow:0 4px 0 var(--ledge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.adult>summary::-webkit-details-marker{display:none}
.adult[open]>summary{margin-bottom:14px}
.adult>.grown+.grown{margin-top:14px}
.back,.ctl,.rb{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stars{flex:0 1 auto;margin:0 auto;background:var(--glass);border-radius:999px;padding:6px 18px;font-size:32px;box-shadow:0 4px 0 var(--ledge)}
.q{font-weight:900;letter-spacing:-.01em;text-shadow:0 2px 0 var(--shine)}
.row{background:var(--glass)}

/* picture cards */
.card{background:linear-gradient(180deg,var(--shine),rgba(255,255,255,0) 48%),var(--c);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.06),0 calc(var(--s)*.045) 0 var(--ledge),0 14px 26px rgba(31,42,68,.12)}
.card .emo{filter:drop-shadow(0 5px 3px rgba(0,0,0,.14))}
.card .word{font-weight:800}
.obj{background:linear-gradient(180deg,var(--shine),rgba(255,255,255,0) 48%),var(--glass)}
.obj .badge{box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ans{background:linear-gradient(180deg,var(--shine),rgba(255,255,255,0) 50%),var(--glass);box-shadow:0 6px 0 var(--ledge),0 12px 22px rgba(31,42,68,.1)}

/* drawing board: dotted paper */
.board{background:radial-gradient(circle,var(--ledge) 1.2px,transparent 1.8px) 0 0/26px 26px,var(--panel);border-radius:36px}

/* drum */
.drum{background:radial-gradient(circle at 50% 40%,#FFE6FF 0 35%,#FFB5FB 36% 70%,#F28CEB 71%);box-shadow:inset 0 -10px 0 rgba(0,0,0,.08),0 12px 0 var(--ledge),0 22px 36px rgba(31,42,68,.18)}

/* floor tiles: soft foam mats with stitching */
.tile{background:linear-gradient(150deg,rgba(255,255,255,.38),rgba(255,255,255,0) 42%),var(--c);
  box-shadow:inset 0 calc(var(--s)*-.04) 0 rgba(0,0,0,.12),0 calc(var(--s)*.04) 0 rgba(0,0,0,.18),0 18px 30px rgba(31,42,68,.18)}
.tile::after{content:"";position:absolute;inset:10%;border-radius:calc(var(--s)*.09);border:calc(var(--s)*.012) dashed rgba(255,255,255,.55);pointer-events:none}
.tile.dim{opacity:.22;filter:saturate(.55)}
.tile.lit{box-shadow:inset 0 calc(var(--s)*-.04) 0 rgba(0,0,0,.12),0 0 0 calc(var(--s)*.04) #fff,0 0 0 calc(var(--s)*.075) var(--ink),0 0 calc(var(--s)*.35) calc(var(--s)*.02) var(--c)}
.tbadge{z-index:1}
.tbadge.part{filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
#jq{font-size:clamp(28px,4.4vw,50px)}
.pbtn{background:var(--glass);font-weight:800}
.pbtn.ok{background:linear-gradient(180deg,#45C485,#2A9A60);color:#fff;font-size:22px;padding:16px 34px}
.lvl{background:linear-gradient(180deg,var(--shine),rgba(255,255,255,0) 50%),var(--glass)}
.big-rec{font-weight:800}

/* celebration */
.party{background:radial-gradient(circle at 50% 45%,var(--sky1),var(--bg));overflow:hidden}
.conf{position:absolute;top:-12vh;font-size:clamp(28px,5vw,48px);animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(125vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.hero-emo span,.conf{animation:none}.conf{display:none}}
img.em{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.chip .ci img.em{vertical-align:middle}
</style>
</head>
<body>
<div id="app"></div>

const recURL={};
let idb=null;
function openDB(){
  if(idb)return Promise.resolve(idb);
  return new Promise((res,rej)=>{
    try{const r=indexedDB.open('pokazhi-i-skazhi',2);
      r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('rec'))d.createObjectStore('rec');if(!d.objectStoreNames.contains('family'))d.createObjectStore('family',{keyPath:'id'});};
      r.onsuccess=()=>{idb=r.result;res(idb);};r.onerror=()=>rej(r.error);
    }catch(e){rej(e);}
  });
}
async function dbDo(mode,fn,store='rec'){const d=await openDB();return new Promise((res,rej)=>{const tx=d.transaction(store,mode);const st=tx.objectStore(store);const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);});}
async function loadRecs(){
  try{
    const d=await openDB();
    await new Promise(res=>{
      const tx=d.transaction('rec','readonly');const cur=tx.objectStore('rec').openCursor();
      cur.onsuccess=()=>{const c=cur.result;if(c){recURL[c.key]=URL.createObjectURL(c.value);c.continue();}};
      tx.oncomplete=res;tx.onerror=res;
    });
  }catch(e){}
  render();
}
async function saveRec(key,blob){delete recBuf[key];try{await dbDo('readwrite',st=>st.put(blob,key));}catch(e){}if(recURL[key])URL.revokeObjectURL(recURL[key]);recURL[key]=URL.createObjectURL(blob);}
const famURL={};
async function loadFamily(){
  let rows=[];
  try{const d=await openDB();rows=await new Promise(res=>{const r=d.transaction('family','readonly').objectStore('family').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([]);});}catch(e){}
  for(const id in famURL){URL.revokeObjectURL(famURL[id]);delete famURL[id];}
  rows.sort((a,b)=>a.t-b.t);
  CATS.family.items=rows.map((r,i)=>{famURL[r.id]=URL.createObjectURL(r.blob);return {img:famURL[r.id],w:r.name,s:null,fx:null,hint:null,c:COLORS[i%COLORS.length],key:'family:'+r.id,id:r.id,keep:true};});
  if(state.cat==='family'&&!CATS.family.items.length)state.cat='animals';
  render();
}

let ac=null,fxOut=null;
function AC(){
  if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();}
  if(ac.state==='suspended')ac.resume();
  return ac;
}
function stopFx(){if(fxOut){try{fxOut.gain.cancelScheduledValues(0);fxOut.gain.value=0;fxOut.disconnect();}catch(e){}fxOut=null;}}
function newOut(){const c=AC();if(!c)return null;stopFx();fxOut=c.createGain();fxOut.gain.value=0.9;fxOut.connect(c.destination);return fxOut;}
function env(g,t,a,hold,r,peak){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+r);}
function osc(out,type,f,t,dur,peak,filt){
  const c=ac,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  let n=o;if(filt){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=filt;o.connect(fl);n=fl;}
  n.connect(g);g.connect(out);env(g,t,0.02,Math.max(0,dur-0.08),0.06,peak);o.start(t);o.stop(t+dur+0.1);return o;
}
let noiseBuf=null;
function noise(out,t,dur,type,freq,q){
  const c=ac;
  if(!noiseBuf){noiseBuf=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const src=c.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(freq,t);if(q)fl.Q.value=q;
  const g=c.createGain();g.gain.value=0;src.connect(fl);fl.connect(g);g.connect(out);src.start(t);src.stop(t+dur+0.1);
  return {g,fl};
}
const FX={
  car(){const o=newOut();if(!o)return;const t=ac.currentTime+0.02;
    [0,0.3].forEach(d=>{osc(o,'square',415,t+d,0.2,0.12,1800);osc(o,'square',520,t+d,0.2,0.1,1800);});},
  bus(){const o=newOut();if(!o)return;const t=ac.currentTime+0.02;

    s.connect(fl);fl.connect(g);g.connect(o);
    for(let i=0;i<4;i++){s.frequency.setValueAtTime(640,t+i*0.6);s.frequency.linearRampToValueAtTime(980,t+i*0.6+0.3);s.frequency.setValueAtTime(980,t+i*0.6+0.3);s.frequency.linearRampToValueAtTime(640,t+i*0.6+0.6);}

  heli(){const o=newOut();if(!o)return;const t=ac.currentTime+0.02;

  plane(){const o=newOut();if(!o)return;const t=ac.currentTime+0.02;

    n.g.gain.setValueAtTime(0.001,t);n.g.gain.exponentialRampToValueAtTime(0.7,t+1.2);n.g.gain.exponentialRampToValueAtTime(0.001,t+2.6);
    const d=ac.createOscillator(),g=ac.createGain();d.type='sawtooth';d.frequency.setValueAtTime(110,t);d.frequency.linearRampToValueAtTime(140,t+1.3);d.frequency.linearRampToValueAtTime(95,t+2.6);

  train(){const o=newOut();if(!o)return;const t=ac.currentTime+0.02;

function speakSeq(parts,onDone){
  stopAudio();
  const tok=speakToken;let i=0;
  const next=()=>{
    if(tok!==speakToken)return;
    if(i>=parts.length){onDone&&onDone();return;}
    const p=parts[i++];let stepDone=false;
    const step=()=>{if(stepDone)return;stepDone=true;clearTimeout(fallbackTimer);next();};
    const key=typeof p==='object'?p.rec:(recURL['ph:'+p]?'ph:'+p:null);
    if(key&&recURL[key]){playRecRaw(key,step,tok);return;}
    if(typeof p==='object'||!synth){step();return;}
    const u=new SpeechSynthesisUtterance(p);u.lang='ru-RU';const v=currentVoice();if(v)u.voice=v;u.rate=state.rate;u.pitch=1;
    u.onend=step;u.onerror=step;synth.speak(u);
    fallbackTimer=setTimeout(step,1200+p.length*110/state.rate);
  };

  if(synth&&(synth.speaking||synth.pending)){synth.cancel();speakTimer=setTimeout(next,80);}else next();
}

function sayItem(it,prefix){

let mediaRec=null,recStream=null,recTimer=null;
async function startRec(key){
  if(state.recKey){stopRec();return;}
  stopAudio();if(synth)synth.cancel();
  state.recError=null;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    state.recError='На этой странице запись недоступна: браузер не даёт доступ к микрофону.';render();return;
  }
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){state.recError='Нет доступа к микрофону. Разрешите микрофон для этой страницы и попробуйте ещё раз. Если не получается, запись на этой странице, к сожалению, недоступна.';render();return;}
  const pick=['audio/mp4','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  const chunks=[];
  mediaRec=new MediaRecorder(recStream,pick?{mimeType:pick}:undefined);
  mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mediaRec.onstop=async()=>{
    recStream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:mediaRec.mimeType||pick||'audio/mp4'});
    state.recKey=null;
    if(blob.size>0){await saveRec(key,blob);playRec(key);}
    render();
  };

/* ---------- drawing: trace the dotted line ---------- */
function circlePts(cx,cy,r,n=56){const p=[];for(let i=0;i<=n;i++){const a=-Math.PI/2+i/n*Math.PI*2;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return p;}
function wavePts(x0,x1,y,amp,per,n=70){const p=[];for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;p.push([x,y+amp*Math.sin(i/n*per*Math.PI*2)]);}return p;}
const TRACES=[
  {w:'Мячик',reward:'⚽',strokes:[circlePts(50,50,30)]},
  {w:'Дождик',reward:'🌧️',deco:[['☁️',50,22,30]],strokes:[[[28,44],[28,84]],[[44,44],[44,84]],[[60,44],[60,84]],[[76,44],[76,84]]]},
  {w:'Дорожка',reward:'🏠',deco:[['🚗',12,50,15],['🏠',88,50,15]],strokes:[wavePts(20,80,50,14,1.5)]},
  {w:'Солнышко',reward:'☀️',strokes:[circlePts(50,50,16,40),...Array.from({length:8},(_,k)=>{const a=k/8*Math.PI*2;return [[50+24*Math.cos(a),50+24*Math.sin(a)],[50+38*Math.cos(a),50+38*Math.sin(a)]];})]},
  {w:'Травка',reward:'🌱',strokes:[[[14,80],[24,45],[34,80],[44,45],[54,80],[64,45],[74,80],[84,45]]]},
  {w:'Домик',reward:'🏠',strokes:[[[26,52],[26,84],[74,84],[74,52]],[[18,54],[50,20],[82,54]]]},
  {w:'Змейка',reward:'🐍',deco:[['🐍',86,40,14]],strokes:[wavePts(12,76,55,18,2)]}
];
const PALETTE=['#FF5A5F','#3B82F6','#22A45D','#F59E0B','#A855F7','#EC4899'];
let tr=null; /* current trace session */
function resample(stroke,step=2,si=0){
  const out=[];for(let i=1;i<stroke.length;i++){const [x0,y0]=stroke[i-1],[x1,y1]=stroke[i];const len=Math.hypot(x1-x0,y1-y0);const n=Math.max(1,Math.round(len/step));for(let k=0;k<n;k++)out.push({x:x0+(x1-x0)*k/n,y:y0+(y1-y0)*k/n,hit:false,si});}
  const last=stroke[stroke.length-1];out.push({x:last[0],y:last[1],hit:false,si});return out;
}
function startDraw(){state.mode='draw';state.trace=-1;nextTrace();}
function nextTrace(){
  state.trace=(state.trace+1)%TRACES.length;
  const t=TRACES[state.trace];
  stopHand();
  tr={t,targets:t.strokes.flatMap((s,si)=>resample(s,2,si)),lines:[],cur:null,done:false,color:0,hand:null};
  render();
  setTimeout(()=>speakSeq([t.w+'!','Веди пальчиком!']),300);
  setTimeout(()=>{if(state.mode==='draw')startHand();},700);
}
function drawHTML(){
  const t=TRACES[state.trace];
  const pts=s=>s.map(p=>p.join(',')).join(' ');
  const svg=`<svg viewBox="0 0 100 100" aria-hidden="true">
    ${t.strokes.map(s=>`<polyline points="${pts(s)}" fill="none" stroke="var(--soft)" stroke-opacity=".5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".1 5.5"/>`).join('')}
    ${t.strokes.map(s=>`<circle cx="${s[0][0]}" cy="${s[0][1]}" r="3.4" fill="#22A45D"><animate attributeName="r" values="3.4;5.2;3.4" dur="1.3s" repeatCount="indefinite"/></circle>`).join('')}
    ${(t.deco||[]).map(([e,x,y,sz])=>{const u=IMG[e.replace(/\uFE0F/g,'')];return u?`<image href="${u}" x="${x-sz/2}" y="${y-sz/2}" width="${sz}" height="${sz}"/>`:`<text x="${x}" y="${y}" font-size="${sz}" text-anchor="middle" dominant-baseline="central">${e}</text>`;}).join('')}
  </svg>`;
  return `<header class="bar">${holdBack()}<div class="title">${esc(t.w)}</div>
    <button class="ctl" data-act="erase" aria-label="Стереть">${em('🧽')}</button><button class="ctl" data-act="nexttrace" aria-label="Следующая картинка">${em('➡️')}</button></header>
  <main class="stage" id="stage"><div class="board" id="board">${svg}<canvas id="cv"></canvas></div></main>`;
}
function fitBoard(){
  const st=document.getElementById('stage'),b=document.getElementById('board'),cv=document.getElementById('cv');
  if(!st||!b||!cv)return;
  const size=Math.floor(Math.min(st.clientWidth,st.clientHeight,760));
  b.style.setProperty('--b',size+'px');
  const dpr=window.devicePixelRatio||1;cv.width=size*dpr;cv.height=size*dpr;
  redrawLines();
}
function redrawLines(){
  const cv=document.getElementById('cv');if(!cv||!tr)return;
  const g=cv.getContext('2d'),k=cv.width/100;
  g.clearRect(0,0,cv.width,cv.height);g.lineCap='round';g.lineJoin='round';g.lineWidth=4.2*k;
  for(const ln of tr.lines){if(ln.pts.length<1)continue;g.strokeStyle=ln.c;g.beginPath();g.moveTo(ln.pts[0][0]*k,ln.pts[0][1]*k);
    if(ln.pts.length===1)g.lineTo(ln.pts[0][0]*k+0.1,ln.pts[0][1]*k);for(const p of ln.pts)g.lineTo(p[0]*k,p[1]*k);g.stroke();}
}
function wireCanvas(){
  const cv=document.getElementById('cv');if(!cv)return;
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100];};
  const mark=([x,y])=>{for(const p of tr.targets)if(!p.hit&&Math.hypot(p.x-x,p.y-y)<7.5)p.hit=true;};
  cv.addEventListener('pointerdown',e=>{if(tr.done)return;e.preventDefault();stopHand();cv.setPointerCapture(e.pointerId);
    tr.cur={c:PALETTE[tr.color++%PALETTE.length],pts:[pos(e)]};tr.lines.push(tr.cur);mark(tr.cur.pts[0]);redrawLines();});
  cv.addEventListener('pointermove',e=>{if(!tr.cur)return;const p=pos(e);const l=tr.cur.pts[tr.cur.pts.length-1];
    /* fill gaps so fast strokes still count */
    const steps=Math.max(1,Math.ceil(Math.hypot(p[0]-l[0],p[1]-l[1])/2));
    for(let i=1;i<=steps;i++)mark([l[0]+(p[0]-l[0])*i/steps,l[1]+(p[1]-l[1])*i/steps]);
    tr.cur.pts.push(p);redrawLines();});
  const up=()=>{if(!tr.cur)return;tr.cur=null;checkTrace();
    if(!tr.done){clearTimeout(handIdle);handIdle=setTimeout(()=>{if(state.mode==='draw'&&tr&&!tr.done&&!tr.cur)startHand();},5000);}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}
let handRAF=null,handIdle=null;
function stopHand(){cancelAnimationFrame(handRAF);clearTimeout(handIdle);if(tr&&tr.hand){tr.hand.remove();tr.hand=null;}}
function startHand(){
  stopHand();if(!tr||tr.done)return;
  const b=document.getElementById('board');if(!b)return;
  const cnt=tr.t.strokes.map((_,si)=>tr.targets.filter(p=>p.si===si&&!p.hit).length);
  const pts=tr.t.strokes[cnt.indexOf(Math.max(...cnt))];
  const seg=[];let L=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);L+=l;}
  const at=f=>{let d=f*L;for(let i=0;i<seg.length;i++){if(d<=seg[i]||i===seg.length-1){const k=seg[i]?Math.min(1,d/seg[i]):0;return [pts[i][0]+(pts[i+1][0]-pts[i][0])*k,pts[i][1]+(pts[i+1][1]-pts[i][1])*k];}d-=seg[i];}return pts[0];};
  const h=document.createElement('div');h.className='hand';h.innerHTML=em('👆');b.appendChild(h);tr.hand=h;
  const place=p=>{h.style.left=p[0]+'%';h.style.top=p[1]+'%';};
  place(pts[0]);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const dur=Math.max(1400,L*28),pause=800;let t0=null;
  const step=ts=>{
    if(t0===null)t0=ts;const e=(ts-t0)%(dur+pause*2);
    if(e<pause){place(pts[0]);h.style.opacity=1;}
    else if(e<pause+dur)place(at((e-pause)/dur));
    else h.style.opacity=0;
    handRAF=requestAnimationFrame(step);
  };
  handRAF=requestAnimationFrame(step);
}
function checkTrace(){
  const hit=tr.targets.filter(p=>p.hit).length/tr.targets.length;
  if(hit<0.85||tr.done)return;
  tr.done=true;stopHand();
  const b=document.getElementById('board');
  const r=document.createElement('div');r.className='reward';r.innerHTML=em(tr.t.reward);b.appendChild(r);
  say(tr.t.w+'! Ура!');
  setTimeout(()=>{if(state.mode==='draw'&&tr&&tr.done)nextTrace();},3500);
}

function fitGrid(){

  best=Math.floor(Math.min(best,state.mode==='find'?380:320));
  g.style.gridTemplateColumns=`repeat(${bc},${best}px)`;
  g.style.setProperty('--s',best+'px');
}

let rh=null;

function drum(){
  const c=AC();if(!c)return;const t=c.currentTime+0.01;
  const out=c.createGain();out.gain.value=1;out.connect(c.destination);
  const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(55,t+0.25);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(1,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+0.45);
  const n=noise(out,t,0.08,'highpass',1800,0.7);n.g.gain.setValueAtTime(0.35,t);n.g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
}

}
function makeOptions(n,L){
  const set=new Set([n]),hi=Math.max(L.max,L.ch);let g=0;
  while(set.size<L.ch&&g++<200){const d=n+Math.floor(Math.random()*5)-2;if(d>=1&&d<=hi)set.add(d);}
  for(let k=1;set.size<L.ch;k++)set.add(k);
  return [...set].sort((a,b)=>a-b);
}
function askAnswer(){
  if(state.mode!=='count')return;
  cn.phase='answer';cn.options=makeOptions(cn.n,LEVELS[state.countLevel]);
  const a=document.getElementById('answers');a.hidden=false;
  a.innerHTML=cn.options.map(v=>`<button class="ans" data-ans="${v}" aria-label="${v}"><b>${v}</b><span class="dots" style="grid-template-columns:repeat(${Math.min(v,5)},14px)">${'<i></i>'.repeat(v)}</span></button>`).join('');
  fitGrid();setQ(question());say(question());
}
function ansTap(el,v){
  if(!cn||cn.phase!=='answer')return;
  if(v===cn.n){cn.phase='done';anim(el,'yay');setQ(summary()+'!');say('Да! '+summary()+'!');winCount();}
  else{
    anim(el,'nope');cn.mist++;cn.phase='demo';say('Давай посчитаем вместе.');
    cn.timer=setTimeout(()=>autoCount(()=>{cn.timer=setTimeout(()=>{if(state.mode!=='count')return;cn.phase='answer';setQ(question());say(question());},1300);}),1600);
  }
}
function autoCount(done){
  const objs=[...document.querySelectorAll('.obj')];
  objs.forEach(e=>{e.classList.remove('on','next');const b=e.querySelector('.badge');if(b)b.remove();});
  let i=0;
  const step=()=>{
    if(state.mode!=='count')return;
    if(i<objs.length){markObj(objs[i],i+1);say(cap(NUM[i+1])+'!');i++;cn.timer=setTimeout(step,850);}
    else{say(summary()+'!');done&&done();}
  };
  cn.timer=setTimeout(step,200);
}
function countDemo(){
  if(!cn)return;
  if(cn.phase==='answer'){say(question());return;}
  if(cn.phase!=='count')return;
  cn.phase='demo';
  autoCount(()=>{
    if(!LEVELS[state.countLevel].ch){cn.phase='done';setQ(summary()+'!');cn.timer=setTimeout(()=>{if(state.mode==='count')newCount();},2600);}
    else cn.timer=setTimeout(askAnswer,1400);
  });
}
function winCount(){
  state.stars++;document.getElementById('stars').innerHTML=starsHTML();
  cn.timer=setTimeout(()=>{
    if(state.mode!=='count')return;
    if(state.stars>=5){
      const up=cn.mist===0&&state.countLevel<4;
      party(()=>{if(state.mode!=='count')return;if(up)state.countLevel++;state.stars=0;cn.mist=0;newCount();},up?'Новый уровень!':'Молодец!');
    }else newCount();
  },2400);
}

/* ---------- jump on the colour (floor tiles) ---------- */
const COLORS4=[{n:'красный',c:'#E5484D'},{n:'жёлтый',c:'#FFC53D'},{n:'синий',c:'#3E63DD'},{n:'зелёный',c:'#30A46C'}];
const JUMP_LEVELS=[
  {icon:'🟥',title:'Один цвет',ex:'«Встань на красный!»'},
  {icon:'🟥 🟦',title:'Два цвета подряд',ex:'«Сначала красный, потом синий!»'},
  {icon:'👣 👣',title:'Две ножки',ex:'«Одна ножка на жёлтый, другая на зелёный!»'},
  {icon:'👣 ✋',title:'Ножка и ручка',ex:'«Ножку на синий, ручку на красный!»'}
];
let jp=null;
function jumpMenuHTML(){
  return `<section class="home">
    <header class="bar"><button class="back" data-act="home">← Назад</button><div class="title">Прыгай на цвет</div></header>
    <div class="lvls">${JUMP_LEVELS.map((l,i)=>`<button class="lvl ${state.jumpLevel===i+1?'on':''}" data-jl="${i+1}" aria-pressed="${state.jumpLevel===i+1}"><span class="li">${l.icon.split(' ').map(em).join(' ')}</span><b>${i+1}. ${l.title}</b><small>${l.ex}</small></button>`).join('')}</div>
    <div class="grown">
      ${seg('Подсказка','jumpHint',[['show','цвет на экране'],['voice','только голос']])}
      ${seg('Плитки на полу лежат','jumpLayout',[['grid','квадратом'],['row','в ряд']])}
      <p class="tip">«Только голос» — следующий шаг на любом уровне: на экране все цвета одинаковые, и ребёнок ориентируется только на слово. После «Верно» нужные плитки подсвечиваются.</p>
      <p class="tip">Показывать на телевизоре: на iPad откройте Пункт управления → «Повтор экрана». Разложите плитки на полу так же, как на экране. Когда ребёнок всё сделал правильно, нажимайте «Верно» (или пробел на клавиатуре).</p>
    </div>
    <button class="pbtn ok play" data-act="jumpstart">▶ Играть</button>
  </section>`;
}
function startJump(){state.mode='jump';state.stars=0;jp={last:-1,targets:[],busy:false,revealed:false,timer:null};newJump();}
function newJump(){
  clearTimeout(jp.timer);
  const pick=excl=>{let i;do{i=Math.floor(Math.random()*4);}while(excl.includes(i));return i;};
  const a=pick([jp.last]),b=pick([a]),L=state.jumpLevel;
  if(L===1)jp.targets=[{t:a,part:'foot'}];
  else if(L===2)jp.targets=[{t:a,k:1},{t:b,k:2}];
  else if(L===3)jp.targets=[{t:a,part:'foot'},{t:b,part:'foot'}];
  else jp.targets=Math.random()<0.5?[{t:a,part:'foot'},{t:b,part:'hand'}]:[{t:a,part:'hand'},{t:b,part:'foot'}];
  jp.last=a;jp.busy=false;jp.revealed=false;
  render();jp.timer=setTimeout(sayJump,400);
}
function jumpText(){
  const T=jp.targets,n=i=>COLORS4[T[i].t].n,L=state.jumpLevel;
  if(L===1)return `Встань на ${n(0)}!`;
  if(L===2)return `Сначала ${n(0)}, потом ${n(1)}!`;
  if(L===3)return `Одна ножка на ${n(0)}, другая на ${n(1)}!`;
  const w=i=>T[i].part==='hand'?'ручку':'ножку';
  return cap(`${w(0)} на ${n(0)}, ${w(1)} на ${n(1)}!`);
}
function sayJump(){if(state.mode==='jump')say(jumpText());}
function tilesHTML(){
  const show=jp.revealed||state.jumpHint==='show';
  return COLORS4.map((c,i)=>{
    const tg=jp.targets.find(x=>x.t===i),lit=show&&!!tg,dim=show&&!tg;
    let inner='';
    if(lit&&tg.k)inner=`<span class="tbadge">${tg.k}</span>`;
    else if(lit&&tg.part&&state.jumpLevel>1)inner=`<span class="tbadge part">${em(tg.part==='hand'?'✋':'👣')}</span>`;
    return `<div class="tile ${lit?'lit':''} ${dim?'dim':''}" data-t="${i}" style="--c:${c.c}" aria-label="${c.n}">${inner}</div>`;
  }).join('');
}
function jumpHTML(){
  const q=state.jumpHint==='show'||jp.revealed?jumpText():'Слушай и прыгай!';
  return `<header class="bar">${holdBack()}<div class="stars" id="stars">${starsHTML()}</div><button class="ctl" data-act="jumprepeat" aria-label="Повторить">${em('🔊')}</button></header>
  <div class="q" id="jq">${esc(q)}</div>
  <main class="stage" id="stage"><div class="tiles" id="tiles">${tilesHTML()}</div></main>
  <div class="pbar"><button class="pbtn ok" data-act="jumpok">✓ Верно</button><button class="pbtn" data-act="jumpnext">⏭ Другое задание</button></div>`;
}
function fitTiles(){
  const st=document.getElementById('stage'),g=document.getElementById('tiles');if(!st||!g)return;
  const cols=state.jumpLayout==='row'?4:2,rows=4/cols,W=st.clientWidth,H=st.clientHeight,gap=Math.round(Math.min(W,H)*0.05);
  const sz=Math.floor(0.86*Math.min((W-gap*(cols-1))/cols,(H-gap*(rows-1))/rows));
  g.style.gridTemplateColumns=`repeat(${cols},${sz}px)`;g.style.gap=gap+'px';g.style.setProperty('--s',sz+'px');
}
addEventListener('resize',()=>{if(state.mode==='jump')fitTiles();});
function jumpOk(){
  if(state.mode!=='jump'||!jp||jp.busy)return;
  jp.busy=true;jp.revealed=true;
  document.getElementById('tiles').innerHTML=tilesHTML();
  document.getElementById('jq').textContent=jumpText();
  jp.targets.forEach(x=>{const el=document.querySelector(`.tile[data-t="${x.t}"]`);if(el)anim(el,'yay');});
  say(state.jumpLevel===1?`Молодец! ${cap(COLORS4[jp.targets[0].t].n)}!`:'Молодец!');
  state.stars++;document.getElementById('stars').innerHTML=starsHTML();
  jp.timer=setTimeout(()=>{
    if(state.mode!=='jump')return;
    if(state.stars>=5)party(()=>{if(state.mode==='jump'){state.stars=0;newJump();}});
    else newJump();
  },2400);
}
document.addEventListener('keydown',e=>{
  if(state.mode!=='jump')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();jumpOk();}
  else if(e.key==='ArrowRight'){e.preventDefault();if(!jp.busy)newJump();}
  else if(e.key==='r'||e.key==='к'){sayJump();}
});

/* victory fanfare: "ta-ta-ta-taaa" on brass, final chord, bells and a cymbal */
function fanfare(){
  const c=AC();if(!c)return;
  const out=c.createGain();out.gain.value=0.85;out.connect(c.destination);
  const t=c.currentTime+0.05;
  const brass=(f,st,d,v=0.14)=>{
    [['square',0,1.5],['sawtooth',-7,2],['sawtooth',7,2]].forEach(([type,det,div])=>{
      const o=c.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;
      const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(700,st);fl.frequency.linearRampToValueAtTime(3200,st+0.06);fl.frequency.linearRampToValueAtTime(1600,st+d);
      const g=c.createGain(),pk=v/div;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(pk,st+0.03);g.gain.setValueAtTime(pk,st+Math.max(0.04,d-0.05));g.gain.exponentialRampToValueAtTime(0.0001,st+d+0.15);
      o.connect(fl);fl.connect(g);g.connect(out);o.start(st);o.stop(st+d+0.25);
    });
  };
  const G4=392,C5=523.25,E5=659.25,G5=783.99,C6=1046.5;
  brass(G4,t,0.12);brass(G4,t+0.15,0.12);brass(G4,t+0.3,0.12);brass(C5,t+0.45,0.36);
  brass(E5,t+0.86,0.12);brass(C5,t+1.01,0.12);
  [C5,E5,G5,C6].forEach(f=>brass(f,t+1.17,0.8,0.09));
  [1568,2093,2637,3136].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),st=t+1.2+i*0.09;o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.06,st);g.gain.exponentialRampToValueAtTime(0.0001,st+0.7);o.connect(g);g.connect(out);o.start(st);o.stop(st+0.8);});
  const n=noise(out,t+1.17,1,'highpass',5500,0.5);n.g.gain.setValueAtTime(0.13,t+1.17);n.g.gain.exponentialRampToValueAtTime(0.001,t+2.1);
}

function party(next,text='Молодец!'){
  const p=document.createElement('div');p.className='party';
  p.innerHTML=`<div class="big">${em('🎉')}</div><div>${text}</div>`;
  const CF=['🎈','⭐','✨','🎉','🌟','🎊'];
  for(let i=0;i<22;i++){const c=document.createElement('span');c.className='conf';c.innerHTML=em(CF[i%CF.length]);c.style.left=(Math.random()*96)+'%';c.style.animationDuration=(2.2+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.6)+'s';c.style.setProperty('--r',(Math.random()*540-270)+'deg');p.appendChild(c);}
  document.body.appendChild(p);stopAudio();if(synth)synth.cancel();fanfare();
  const sayT=setTimeout(()=>say('Ура! '+text),2100);
  setTimeout(()=>{clearTimeout(sayT);p.remove();next&&next();},4300);
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const d=b.dataset;
  if(b.classList.contains('obj')){objTap(b);return;}
  if(d.ans!==undefined){ansTap(b,+d.ans);return;}
  if(d.cat){if(state.recKey)return;state.homeMsg=null;state.cat=d.cat;state.last=null;render();return;}
  if(d.jl){state.jumpLevel=+d.jl;render();return;}
  if(d.set){const nv=parseFloat(d.val);state[d.set]=isNaN(nv)?d.val:nv;render();return;}
  if(d.voice){state.voiceURI=d.voice;render();say('Кошка! Мяу, мяу!');return;}
  if(d.famdel!==undefined){delFamily(CATS.family.items[+d.famdel]);return;}
  if(d.rec!==undefined){startRec(cat().items[+d.rec].key);return;}
  if(d.play!==undefined){playRec(cat().items[+d.play].key);return;}
  if(d.del!==undefined){delRec(cat().items[+d.del].key).then(render);return;}
  const a=d.act;
  if(a==='listen')return startListen();
  if(a==='find')return startFind();
  if(a==='draw')return startDraw();
  if(a==='rhythm')return startRhythm();
  if(a==='count')return startCount();
  if(a==='jump'){state.mode='jumpmenu';render();return;}
  if(a==='jumpstart')return startJump();
  if(a==='jumpok'){jumpOk();return;}
  if(a==='jumpnext'){if(jp&&!jp.busy)newJump();return;}
  if(a==='jumprepeat'){sayJump();return;}
  if(a==='countdemo'){countDemo();return;}
  if(a==='rhreplay'){if(rh&&rh.phase!=='demo')demo();return;}
  if(a==='family'){state.mode='family';state.famErr=null;render();return;}
  if(a==='fampick'){const f=document.getElementById('famfile');if(f)f.click();return;}
  if(a==='famadd'){addFamily();return;}
  if(a==='erase'){if(tr&&!tr.done){tr.lines=[];tr.targets.forEach(p=>p.hit=false);redrawLines();startHand();}return;}
  if(a==='nexttrace'){nextTrace();return;}
  if(a==='record'){state.mode='record';state.recError=null;render();return;}
  if(a==='home')return goHome();
  if(a==='testvoice'){say('Кошка! Мяу, мяу!');return;}
  if(a==='shuffle'){pickListen();render();return;}
  if(a==='repeat'){say(`Где ${nm(state.target)}?`);return;}
  if(b.classList.contains('card')){
    const i=+d.i;
    if(state.mode==='listen'){anim(b,'pop');sayItem(state.listenItems[i]);}
    else if(state.mode==='find')findTap(b,state.options[i]);
  }
});
app.addEventListener('input',e=>{
  if(e.target.id!=='famname')return;
  state.famName=e.target.value;
  const b=app.querySelector('[data-act="famadd"]');if(b)b.disabled=!(state.famDraft&&state.famName.trim());
});
app.addEventListener('change',async e=>{
  if(e.target.id!=='famfile'||!e.target.files||!e.target.files[0])return;
  try{const blob=await resizeImage(e.target.files[0]);if(state.famDraft)URL.revokeObjectURL(state.famDraft.url);state.famDraft={blob,url:URL.createObjectURL(blob)};state.famErr=null;}
  catch(err){state.famErr='Не получилось открыть это фото. Попробуйте другое.';}
  render();
});
app.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('adult'))state.adultOpen=e.target.open;},true);
render();
loadRecs().then(loadFamily);
